[project]
name = "context-orchestrator"
version = "0.3.0"
description = "Task-aware context management MCP server for LLMs"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x renamed FastMCP → MCPServer and changed APIs; a fresh install
    # resolved 2.x and the server died on import. Pin until server.py is ported.
    "mcp[cli]>=1.0.0,<2",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
save-transcript = "context_orchestrator.cli:main"
transcript-watcher = "context_orchestrator.watcher:main"
context-orchestrator-chroma = "context_orchestrator.chroma_daemon:main"
# The MCP server as a real executable, so a packaged install (Homebrew) can
# register one stable path with `claude mcp add` instead of python -m + PYTHONPATH.
contorch-mcp = "context_orchestrator.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional embedding upgrades. Install with:
#   pip install -e '.[embeddings]'
# Then set CO_EMBEDDING_MODEL=nomic-ai/nomic-embed-text-v1.5 (or any
# sentence-transformers model name). Note: switching the model
# invalidates existing vectors — wipe the collection / chroma path
# first so HNSW dimensions match.
embeddings = [
    "sentence-transformers>=2.0",
    "einops>=0.6",  # required by nomic-embed-text-v1.5
]
# Gemini embeddings + reranker via Google's API. Install with:
#   pip install -e '.[embeddings-gemini]'
# Then set:
#   CO_EMBEDDING_MODEL=gemini-embedding-001    (3072d, top-MTEB)
#   CO_RERANK_MODEL=gemini-flash-latest        (LLM rerank — see search.py)
# API key is read from $GOOGLE_API_KEY, $GEMINI_API_KEY, or
# ~/.config/google/key (mode 600).
embeddings-gemini = [
    "google-genai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_orchestrator"]
